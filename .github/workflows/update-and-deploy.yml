name: Update prices and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install yfinance pandas numpy
      - name: Fetch latest closes
        run: python scripts/fetch_prices.py
      - name: Commit prices.json if changed
        run: |
          git config user.name "fcn-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/prices.json
          git diff --cached --quiet || git commit -m "prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
